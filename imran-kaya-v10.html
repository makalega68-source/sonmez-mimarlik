<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8">
<title>İmran Kaya Sanat Okulu Yönetim</title>
<style>
:root{--bg:#f6f2ed;--card:#ffffff;--ink:#171717;--muted:#7b746e;--line:#e9e1d9;--accent:#7b3ff2;--accent2:#aa7cff;--green:#138a5b;--red:#d74d5b;--orange:#d68a35;--shadow:0 14px 35px rgba(66,48,35,.08)}
*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:linear-gradient(180deg,#eee7df 0,#f6f2ed 35%,#eee7df 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg);padding:16px 18px 124px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 18px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 78%,rgba(246,242,237,0))}.brand{display:flex;align-items:center;gap:12px}.brandMark{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#7b3ff2,#ad7dff);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 10px 24px #7b3ff235}.brandText b{display:block;font-size:22px;letter-spacing:.3px}.brandText span{display:block;color:var(--muted);font-size:14px;margin-top:3px}.menu{width:52px;height:52px;border:1px solid var(--line);border-radius:17px;background:#fff;color:#222;font-size:25px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(145deg,#1c1730,#282044);color:#fff;border-radius:28px;padding:24px;box-shadow:0 20px 45px rgba(50,32,80,.22)}.heroTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#c9b7ff;font-weight:900}.hero h1{font-size:31px;line-height:1.08;margin:8px 0 9px}.hero p{font-size:16px;line-height:1.5;color:#ddd4f4;margin:0}.aiOrb{width:62px;height:62px;flex:0 0 62px;border-radius:20px;background:linear-gradient(145deg,#7b3ff2,#c084fc);display:grid;place-items:center;font-size:30px}.heroStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.heroStat{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:16px;padding:13px}.heroStat span{display:block;font-size:12px;color:#cfc5e8}.heroStat b{display:block;font-size:20px;margin-top:4px}.aiStart{width:100%;border:0;border-radius:16px;background:#fff;color:#251b3d;padding:15px;margin-top:14px;font-weight:900;font-size:17px}
.section{margin-top:18px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 3px 10px}.sectionHead h2{font-size:22px;margin:0}.sectionHead button{border:0;background:none;color:var(--accent);font-weight:800}.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quickBtn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;text-align:left;min-height:118px;box-shadow:var(--shadow)}.quickIcon{width:42px;height:42px;border-radius:14px;background:#f0e9ff;display:grid;place-items:center;font-size:22px}.quickBtn b{display:block;font-size:16px;margin-top:13px}.quickBtn small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.cardHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.cardHead h2{font-size:22px;margin:0}.addBtn{border:0;background:#1f1f1f;color:#fff;border-radius:13px;padding:10px 14px;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#faf8f5;color:#726b65;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:14px}.tab.on{background:#20182e;color:#fff;border-color:#20182e}.item{display:grid;grid-template-columns:1fr auto;gap:13px;padding:15px 0;border-bottom:1px solid #efe9e2}.item:last-child{border-bottom:0}.itemTitle{font-size:18px;font-weight:850}.itemSub{font-size:14px;color:var(--muted);margin-top:4px}.amount{font-size:19px;font-weight:900;text-align:right}.status{display:inline-block;margin-top:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}.status.pending{background:#fff3e6;color:#b56515}.status.paid{background:#e8f7ef;color:#0e7b50}.rowActions{display:flex;gap:7px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}.miniBtn{border:1px solid var(--line);background:#fff;color:#3b3835;border-radius:10px;padding:7px 10px;font-size:13px}.miniBtn.danger{color:#b93242;border-color:#efc9cf;background:#fff7f8}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}.metric{background:#faf8f5;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:7px;font-size:21px}.metric.in b{color:var(--green)}.metric.out b{color:var(--red)}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);padding:8px 5px calc(10px + env(safe-area-inset-bottom));z-index:40;border-top:1px solid var(--line)}.nav button{border:0;background:none;color:#8c857f;font-size:12px;padding:6px 3px}.nav button.on{color:var(--accent);font-weight:800}.nav span{display:block;font-size:23px;margin-bottom:3px}
.overlay{display:none;position:fixed;inset:0;background:#1c1525aa;z-index:100;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:91vh;overflow:auto;background:#fff;color:#171717;border-radius:28px 28px 0 0;padding:22px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(23,17,31,.25)}.modalTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal h2{font-size:25px;margin:0}.x{width:44px;height:44px;border:0;border-radius:50%;background:#f2eee9;font-size:23px}.form{display:grid;gap:12px;margin-top:18px}.form label{font-weight:800;font-size:15px}.form input,.form select,.form textarea{width:100%;border:1px solid #dcd5ce;border-radius:13px;background:#fff;padding:14px;font-size:16px}.form textarea{min-height:110px;resize:vertical}.formActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:5px}.primary,.cancel{border-radius:13px;padding:14px;font-weight:900;min-height:50px}.primary{border:0;background:#20182e;color:#fff}.cancel{border:1px solid #cfc7bf;background:#fff;color:#3e3935}.studentRow{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:#fcfaf8}.studentRow b{font-size:17px}.studentRow small{display:block;color:var(--muted);font-size:14px;margin-top:4px}.studentActions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.studentActions button{border:1px solid #d8d0c9;background:#fff;border-radius:10px;padding:8px 11px}.studentActions .danger{color:#bb3344;border-color:#edc2c8}.chatBox{background:#211a31;color:#fff;border-radius:16px;padding:15px;white-space:pre-wrap;line-height:1.55;font-size:16px;margin-top:14px}.empty{color:#9a928b;padding:12px 0;font-size:15px}
@media(max-width:560px){html{font-size:17px}.app{padding:12px 14px 118px}.hero{padding:20px}.hero h1{font-size:27px}.heroStats{grid-template-columns:1fr 1fr 1fr}.quickGrid{grid-template-columns:1fr 1fr}.card{padding:18px}.item{grid-template-columns:1fr}.amount{text-align:left}.rowActions{justify-content:flex-start}.brandText b{font-size:19px}.brandMark{width:48px;height:48px}.menu{width:48px;height:48px}.metrics{grid-template-columns:1fr}.metric{text-align:left}.metric span,.metric b{display:inline-block}.metric b{float:right;margin-top:0}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="brandMark">İK</div><div class="brandText"><b>İmran Kaya</b><span>Sanat Okulu Yönetim</span></div></div><button class="menu" type="button" onclick="openMenu()">☰</button></header>
<section class="hero"><div class="heroTop"><div><div class="eyebrow">Yönetim Merkezi</div><h1>Bugün okulda<br>neyi büyütüyoruz?</h1><p>Öğrenci, tahsilat ve işletme kayıtlarını tek ekrandan yönetin.</p></div><div class="aiOrb">✦</div></div><div class="heroStats"><div class="heroStat"><span>Öğrenci</span><b id="heroStudents">0</b></div><div class="heroStat"><span>Bekleyen</span><b id="heroPending">0</b></div><div class="heroStat"><span>Net</span><b id="heroNet">₺0</b></div></div><button class="aiStart" type="button" onclick="openAI('')">AI Asistanı Aç →</button></section>
<section class="section"><div class="sectionHead"><h2>Hızlı İşlemler</h2><button type="button" onclick="openMenu()">Tümü</button></div><div class="quickGrid"><button class="quickBtn" type="button" onclick="openStudents()"><div class="quickIcon">👥</div><b>Öğrenciler</b><small>Yeni öğrenci ekle, düzenle veya sil.</small></button><button class="quickBtn" type="button" onclick="scrollToInvoices()"><div class="quickIcon">💳</div><b>Ödemeler</b><small>Bekleyen ve ödenen kayıtları yönet.</small></button><button class="quickBtn" type="button" onclick="scrollToFinance()"><div class="quickIcon">📊</div><b>Gelir / Gider</b><small>Kasayı ve net sonucu takip et.</small></button><button class="quickBtn" type="button" onclick="openReminder()"><div class="quickIcon">📅</div><b>Hatırlatıcı</b><small>Ders ve veli takiplerini kaydet.</small></button></div></section>
<section class="section card" id="invoices"><div class="cardHead"><h2>Faturalar & Ödemeler</h2><button class="addBtn" type="button" onclick="openInvoiceForm()">＋ Ekle</button></div><div class="tabs"><button class="tab on" type="button" onclick="setInvoiceFilter('all',this)">Tümü</button><button class="tab" type="button" onclick="setInvoiceFilter('paid',this)">Ödenen</button><button class="tab" type="button" onclick="setInvoiceFilter('pending',this)">Ödenmeyen</button></div><div id="invoiceList"></div></section>
<section class="section card" id="finance"><div class="cardHead"><h2>Gelir Gider</h2><button class="addBtn" type="button" onclick="openFinanceForm()">＋ Kayıt</button></div><div class="metrics"><div class="metric in"><span>Gelir</span><b id="incomeTotal">₺0</b></div><div class="metric out"><span>Gider</span><b id="expenseTotal">₺0</b></div><div class="metric"><span>Net</span><b id="netTotal">₺0</b></div></div><div id="financeList"></div></section>
</main>
<nav class="nav"><button class="on" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Ana Sayfa</button><button type="button" onclick="openStudents()"><span>♙</span>Öğrenciler</button><button type="button" onclick="scrollToFinance()"><span>₺</span>Finans</button><button type="button" onclick="openReminder()"><span>▣</span>Takvim</button><button type="button" onclick="openAI('')"><span>✦</span>AI</button></nav>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalTop"><h2 id="modalTitle"></h2><button class="x" type="button" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
const STORE='ikso_v8_data';
const seed={students:[{id:'s1',name:'Ayşe Yılmaz',parent:'Mehmet Yılmaz',phone:''},{id:'s2',name:'Mert Kaya',parent:'Selin Kaya',phone:''}],invoices:[{id:'i1',title:'Kira',type:'Kira',due:'2026-08-05',amount:15000,status:'pending'},{id:'i2',title:'Kira',type:'Kira',due:'2026-08-05',amount:15000,status:'paid'}],finance:[{id:'f1',type:'expense',title:'Kira',amount:15000,date:'2026-08-05'}],reminders:[]};
let data=load(),invoiceFilter='all';
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');return x&&Array.isArray(x.students)&&Array.isArray(x.invoices)&&Array.isArray(x.finance)?{...clone(seed),...x,reminders:Array.isArray(x.reminders)?x.reminders:[]}:clone(seed)}catch{return clone(seed)}}
function persist(){localStorage.setItem(STORE,JSON.stringify(data));renderAll()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){const x=Number(n||0);return (x<0?'-':'')+'₺'+Math.abs(x).toLocaleString('tr-TR')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(d){if(!d)return '—';const a=d.split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d}
function field(id){return $(id)}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('overlay').style.display='flex';document.body.style.overflow='hidden'}
function closeModal(){$('overlay').style.display='none';document.body.style.overflow=''}
function renderInvoices(){const rows=data.invoices.filter(x=>invoiceFilter==='all'||x.status===invoiceFilter);$('invoiceList').innerHTML=rows.length?rows.map(x=>`<div class="item"><div><div class="itemTitle">${esc(x.title)}</div><div class="itemSub">${esc(x.type||'Ödeme')} · Vade ${fmtDate(x.due)}</div></div><div><div class="amount">${money(x.amount)}</div><span class="status ${x.status}">${x.status==='paid'?'ÖDENDİ':'BEKLİYOR'}</span><div class="rowActions"><button class="miniBtn" type="button" onclick="editInvoice('${x.id}')">Düzenle</button><button class="miniBtn" type="button" onclick="toggleInvoice('${x.id}')">${x.status==='paid'?'Beklet':'Ödendi'}</button><button class="miniBtn danger" type="button" onclick="deleteInvoice('${x.id}')">Sil</button></div></div></div>`).join(''):'<div class="empty">Bu filtrede kayıt yok.</div>'}
function setInvoiceFilter(f,b){invoiceFilter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderInvoices()}
function invoiceForm(x={}){return `<div class="form"><label>Başlık</label><input id="ivTitle" value="${esc(x.title||'')}"><label>Tür</label><input id="ivType" value="${esc(x.type||'')}"><label>Vade</label><input id="ivDue" type="date" value="${x.due||''}"><label>Tutar</label><input id="ivAmount" type="number" min="0" step="0.01" value="${x.amount??''}"><label>Durum</label><select id="ivStatus"><option value="pending" ${x.status!=='paid'?'selected':''}>Bekliyor</option><option value="paid" ${x.status==='paid'?'selected':''}>Ödendi</option></select><div class="formActions"><button class="cancel" type="button" onclick="closeModal()">Vazgeç</button><button class="primary" type="button" onclick="saveInvoice('${x.id||''}')">Kaydet</button></div></div>`}
function openInvoiceForm(){openModal('Fatura / Ödeme Ekle',invoiceForm())}
function editInvoice(id){const x=data.invoices.find(i=>i.id===id);if(x)openModal('Fatura / Ödeme Düzenle',invoiceForm(x))}
function saveInvoice(id){const title=field('ivTitle').value.trim(),amount=Number(field('ivAmount').value);if(!title||!(amount>0)){alert('Başlık ve sıfırdan büyük tutar zorunlu.');return}const obj={id:id||uid('i'),title,type:field('ivType').value.trim()||'Ödeme',due:field('ivDue').value,amount,status:field('ivStatus').value};if(id){const n=data.invoices.findIndex(x=>x.id===id);if(n>=0)data.invoices[n]=obj}else data.invoices.unshift(obj);persist();closeModal()}
function toggleInvoice(id){const x=data.invoices.find(i=>i.id===id);if(!x)return;x.status=x.status==='paid'?'pending':'paid';persist()}
function deleteInvoice(id){const x=data.invoices.find(i=>i.id===id);if(x&&confirm(`“${x.title}” kaydını silmek istediğinize emin misiniz?`)){data.invoices=data.invoices.filter(i=>i.id!==id);persist()}}
function renderFinance(){const income=data.finance.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),expense=data.finance.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0),net=income-expense;$('incomeTotal').textContent=money(income);$('expenseTotal').textContent=money(expense);$('netTotal').textContent=money(net);$('netTotal').style.color=net>=0?'var(--green)':'var(--red)';$('financeList').innerHTML=data.finance.length?data.finance.map(x=>`<div class="item"><div><div class="itemTitle">${esc(x.title)}</div><div class="itemSub">${x.type==='income'?'Gelir':'Gider'} · ${fmtDate(x.date)}</div></div><div><div class="amount" style="color:${x.type==='income'?'var(--green)':'var(--red)'}">${x.type==='income'?'+':'-'}${money(x.amount)}</div><div class="rowActions"><button class="miniBtn" type="button" onclick="editFinance('${x.id}')">Düzenle</button><button class="miniBtn danger" type="button" onclick="deleteFinance('${x.id}')">Sil</button></div></div></div>`).join(''):'<div class="empty">Henüz gelir/gider kaydı yok.</div>'}
function financeForm(x={}){const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return `<div class="form"><label>Tür</label><select id="fnType"><option value="income" ${x.type==='income'?'selected':''}>Gelir</option><option value="expense" ${x.type!=='income'?'selected':''}>Gider</option></select><label>Açıklama</label><input id="fnTitle" value="${esc(x.title||'')}"><label>Tutar</label><input id="fnAmount" type="number" min="0" step="0.01" value="${x.amount??''}"><label>Tarih</label><input id="fnDate" type="date" value="${x.date||today}"><div class="formActions"><button class="cancel" type="button" onclick="closeModal()">Vazgeç</button><button class="primary" type="button" onclick="saveFinance('${x.id||''}')">Kaydet</button></div></div>`}
function openFinanceForm(){openModal('Gelir / Gider Kaydı',financeForm())}
function editFinance(id){const x=data.finance.find(i=>i.id===id);if(x)openModal('Gelir / Gider Düzenle',financeForm(x))}
function saveFinance(id){const title=field('fnTitle').value.trim(),amount=Number(field('fnAmount').value);if(!title||!(amount>0)){alert('Açıklama ve sıfırdan büyük tutar zorunlu.');return}const obj={id:id||uid('f'),type:field('fnType').value,title,amount,date:field('fnDate').value};if(id){const n=data.finance.findIndex(x=>x.id===id);if(n>=0)data.finance[n]=obj}else data.finance.unshift(obj);persist();closeModal()}
function deleteFinance(id){const x=data.finance.find(i=>i.id===id);if(x&&confirm(`“${x.title}” kaydını silmek istediğinize emin misiniz?`)){data.finance=data.finance.filter(i=>i.id!==id);persist()}}
function studentsHtml(){return `<button class="primary" style="width:100%;margin-top:16px" type="button" onclick="openStudentForm()">＋ Yeni Öğrenci</button>${data.students.length?data.students.map(s=>`<div class="studentRow"><b>${esc(s.name)}</b><small>Veli: ${esc(s.parent||'—')}${s.phone?' · '+esc(s.phone):''}</small><div class="studentActions"><button type="button" onclick="openStudentForm('${s.id}')">Düzenle</button><button class="danger" type="button" onclick="deleteStudent('${s.id}')">Öğrenciyi Sil</button></div></div>`).join(''):'<div class="empty">Öğrenci kaydı yok.</div>'}`}
function openStudents(){openModal('Öğrenciler',studentsHtml())}
function studentForm(s={}){return `<div class="form"><label>Öğrenci Adı</label><input id="stName" value="${esc(s.name||'')}"><label>Veli Adı</label><input id="stParent" value="${esc(s.parent||'')}"><label>Telefon</label><input id="stPhone" value="${esc(s.phone||'')}"><div class="formActions"><button class="cancel" type="button" onclick="openStudents()">Vazgeç</button><button class="primary" type="button" onclick="saveStudent('${s.id||''}')">Kaydet</button></div></div>`}
function openStudentForm(id=''){const s=data.students.find(x=>x.id===id)||{};openModal(id?'Öğrenci Düzenle':'Yeni Öğrenci',studentForm(s))}
function saveStudent(id){const name=field('stName').value.trim();if(!name){alert('Öğrenci adı zorunlu.');return}const obj={id:id||uid('s'),name,parent:field('stParent').value.trim(),phone:field('stPhone').value.trim()};if(id){const n=data.students.findIndex(x=>x.id===id);if(n>=0)data.students[n]=obj}else data.students.unshift(obj);persist();openStudents()}
function deleteStudent(id){const s=data.students.find(x=>x.id===id);if(s&&confirm(`“${s.name}” adlı öğrenciyi silmek istediğinize emin misiniz?`)){data.students=data.students.filter(x=>x.id!==id);persist();openStudents()}}
function openReminder(){openModal('Hatırlatıcı & Takvim',`<div class="form"><label>Hatırlatma</label><input id="rmText" placeholder="Örn. Veli araması"><label>Tarih</label><input id="rmDate" type="date"><div class="formActions"><button class="cancel" type="button" onclick="closeModal()">Vazgeç</button><button class="primary" type="button" onclick="saveReminder()">Kaydet</button></div></div>${data.reminders.map((r,i)=>`<div class="studentRow"><b>${esc(r.text)}</b><small>${fmtDate(r.date)}</small><div class="studentActions"><button class="danger" type="button" onclick="deleteReminder(${i})">Sil</button></div></div>`).join('')}`)}
function saveReminder(){const text=field('rmText').value.trim();if(!text){alert('Hatırlatma metni yazın.');return}data.reminders.unshift({text,date:field('rmDate').value});persist();openReminder()}
function deleteReminder(i){if(confirm('Hatırlatıcı silinsin mi?')){data.reminders.splice(i,1);persist();openReminder()}}
function openAI(preset=''){openModal('AI Asistan',`<div class="form"><label>Sorunuz</label><textarea id="aiQ" placeholder="Örn. Bu ay tahsilatı nasıl hızlandırabilirim?">${esc(preset)}</textarea><div class="formActions"><button class="cancel" type="button" onclick="closeModal()">Vazgeç</button><button class="primary" type="button" onclick="askAI()">Yanıtla</button></div></div><div id="aiAnswer"></div>`)}
function askAI(){const q=field('aiQ').value.trim().toLowerCase();if(!q)return;let t='';const pending=data.invoices.filter(x=>x.status==='pending'),pendingTotal=pending.reduce((s,x)=>s+Number(x.amount||0),0);if(q.includes('tahsil')||q.includes('borç')||q.includes('ödeme'))t=`Şu anda ${pending.length} bekleyen ödeme kaydı var ve toplamı ${money(pendingTotal)}. Önce vadesi geçmiş olanları sırala, aynı gün kısa bir veli hatırlatması gönder, 3 gün sonra ikinci takip yap. Ödeme alındığında kaydı “Ödendi” durumuna geçir.`;else if(q.includes('öğrenci')||q.includes('veli'))t=`Sistemde ${data.students.length} öğrenci kayıtlı. Her öğrenci için veli telefonu, devam durumu ve ödeme notunu eksiksiz tut. Yanlış kayıtları öğrenci ekranındaki “Öğrenciyi Sil” seçeneğiyle kaldırabilirsin.`;else if(q.includes('gider')||q.includes('kâr')||q.includes('zarar')){const inc=data.finance.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),exp=data.finance.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);t=`Kayıtlı gelir ${money(inc)}, gider ${money(exp)}, net ${money(inc-exp)}. Büyük giderleri haftalık kontrol et ve gelir kaydı eksikse gün sonunda tamamla.`}else t='Önce öğrenci kayıtlarını temizle, sonra bekleyen ödemeleri vade sırasına göre takip et, ardından gelir-gider kayıtlarını güncelle. Bu üç alan güncelse yönetim kararları daha güvenilir olur.';$('aiAnswer').innerHTML=`<div class="chatBox">${esc(t)}</div>`}
function openMenu(){openModal('Menü',`<div class="form"><button class="primary" type="button" onclick="openStudents()">Öğrenciler</button><button class="primary" type="button" onclick="closeModal();scrollToInvoices()">Faturalar & Ödemeler</button><button class="primary" type="button" onclick="closeModal();scrollToFinance()">Gelir Gider</button><button class="primary" type="button" onclick="openReminder()">Hatırlatıcı</button><button class="cancel" type="button" onclick="closeModal()">Vazgeç</button></div>`)}
function scrollToInvoices(){$('invoices').scrollIntoView({behavior:'smooth',block:'start'})}function scrollToFinance(){$('finance').scrollIntoView({behavior:'smooth',block:'start'})}
function renderHero(){const pending=data.invoices.filter(x=>x.status==='pending').length,inc=data.finance.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),exp=data.finance.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);$('heroStudents').textContent=data.students.length;$('heroPending').textContent=pending;$('heroNet').textContent=money(inc-exp)}
function renderAll(){renderInvoices();renderFinance();renderHero()}
renderAll();
</script>
</body>
</html>
